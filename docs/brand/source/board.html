<!doctype html>
<html><head><meta charset="utf-8"><title>Northstar OR logo board</title>
<style>
  body { margin: 0; width: 1400px; height: 1020px; font: 15px -apple-system, Helvetica, sans-serif; }
  .dark { background: #0B1220; height: 740px; color: #9BB0C4; }
  .light { background: #F4F7FB; height: 280px; color: #5A6B80; }
  .row { display: flex; align-items: flex-end; gap: 40px; padding: 40px 40px 0; }
  .center { align-items: center; }
  figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .icon { border-radius: 22.5%; display: block; }
</style></head>
<body>
<div class="dark">
  <div class="row">
    <img class="icon" src="../NorthstarOR-AppIcon-1024.svg" width="420" height="420">
    <figure><img class="icon" src="../NorthstarOR-AppIcon-1024.svg" width="180"><span>180px</span></figure>
    <figure><img class="icon" src="../NorthstarOR-AppIcon-1024.svg" width="120"><span>120px</span></figure>
    <figure><img class="icon" src="../NorthstarOR-AppIcon-1024.svg" width="76"><span>76px</span></figure>
    <figure><img class="icon" src="../NorthstarOR-AppIcon-1024.svg" width="58"><span>58px</span></figure>
    <figure><img class="icon" src="../NorthstarOR-AppIcon-1024.svg" width="40"><span>40px</span></figure>
  </div>
  <div class="row center">
    <img src="../lockup-horizontal-dark.svg" width="440">
    <img src="../lockup-stacked-dark.svg" width="240">
    <img src="../mark-color-dark.svg" width="150">
    <img src="../mark-white.svg" width="150">
  </div>
</div>
<div class="light">
  <div class="row center">
    <img src="../lockup-horizontal-light.svg" width="440">
    <img src="../lockup-stacked-light.svg" width="240">
    <img src="../mark-navy.svg" width="150">
    <img src="../mark-color-light.svg" width="150">
    <img src="../mark-color-light.svg" width="48">
  </div>
</div>
</body></html>

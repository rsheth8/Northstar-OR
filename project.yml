# XcodeGen spec. The .xcodeproj is generated from this file and is NOT committed,
# so parallel branches never fight over project.pbxproj.
# Generate:  brew install xcodegen && xcodegen generate && open NorthstarOR.xcodeproj
name: NorthstarOR
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 155.0.0
options:
  bundleIdPrefix: edu.umn.northstar
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your own Apple team in Xcode (Signing & Capabilities) or put it in a local
    # xcconfig; don't commit a personal team ID.
    DEVELOPMENT_TEAM: ""
targets:
  NorthstarOR:
    type: application
    platform: iOS
    dependencies:
      - package: WebRTC
        product: WebRTC
    sources:
      - path: NorthstarOR
    info:
      path: build/NorthstarOR-Info.plist
      properties:
        NSLocalNetworkUsageDescription: "Connect nearby iPads or a rep laptop to exchange fictional support questions, audio and video."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSCameraUsageDescription: "Share your camera with the connected Northstar participant during an accepted fictional call. Video is not saved."
        NSBonjourServices:
          - _nstar-or._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: edu.umn.northstar.or
        TARGETED_DEVICE_FAMILY: "2"
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: NorthstarOR/Supporting/MacCatalyst.entitlements
        SUPPORTS_MACCATALYST: YES
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Northstar OR
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Northstar OR uses the microphone for the in-app rep call and spoken checklist commands. Audio is not saved."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Speech recognition runs on-device to turn spoken commands into checklist actions."
  NorthstarORTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NorthstarORTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: NorthstarOR
  NorthstarORUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: NorthstarORUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: NorthstarOR
schemes:
  NorthstarOR:
    build:
      targets:
        NorthstarOR: all
        NorthstarORTests: [test]
    test:
      targets:
        - NorthstarORTests
        - NorthstarORUITests
